# MMIO trace replay (single core, matrix TestTop).
# The MMIO region is deliberately outside the normal memory region so the
# trace never aliases the DPI memory backing.
[tltest.config]
core                        = 1
core.tl_c                   = 1
core.tl_ul                  = 0
core.tl_m                   = 1
maximum_cycle               = 20000
memory.enable               = 1
memory.start                = 0x00000000
memory.end                  = 0x00080000
memory.backend.ooor         = 0
memory.backend.rd.depth     = 0
memory.backend.rd.latency   = 0
memory.backend.wr.depth     = 0
memory.backend.wr.latency   = 0
memory.backend.cycle_unit   = 2
memory.backend.port.count   = 1
memory.sync.strict          = 0
mmio.enable                 = 1
mmio.start                  = 0x00040000
mmio.end                    = 0x0007ffff
cmo.enable                  = 0
cmo.start                   = 0x00000000
cmo.end                     = 0x00040000
error.hintInaccurate        = 0

[tltest.sequence]
mode.0                      = TRACE_WITH_FENCE
mode.1                      = TRACE_WITH_FENCE

[tltest.fuzzer]
trace.enable                = 1
trace.filepath              = ../../traces/mmio-read.ops
