# Full-suite configuration preserved from a passing saved INI.
# openLLC FUZZ_ARI (random stimulus, no trace)
# Port topology matches the matrix-trace TestTop built by `make vcs-setup`
# (core=1, tl_c=1, tl_ul=0, tl_m=1); CAgent=0 and MAgent=1 both fuzz.
[tltest.config]
core                        = 1
core.tl_c                   = 1
core.tl_ul                  = 0
core.tl_m                   = 1
maximum_cycle               = 300000
memory.enable               = 1
memory.start                = 0x00000000
memory.end                  = 0x00080000
memory.backend.ooor         = 0
memory.backend.rd.depth     = 0
memory.backend.rd.latency   = 0
memory.backend.wr.depth     = 0
memory.backend.wr.latency   = 0
memory.backend.cycle_unit   = 2
memory.backend.port.count   = 1
memory.sync.strict          = 0
mmio.enable                 = 0
mmio.start                  = 0
mmio.end                    = 0
cmo.enable                  = 1
cmo.enable.cbo.clean        = 1
cmo.enable.cbo.flush        = 1
cmo.enable.cbo.inval        = 1
cmo.start                   = 0x00000000
cmo.end                     = 0x00080000
cmo.parallel.depth          = 0

error.hintInaccurate        = 0

[tltest.plugin]
chiseldb.enable             = 1
clog.enable                 = 0

[tltest.sequence]
mode.0                      = FUZZ_ARI
mode.1                      = FUZZ_ARI

[tltest.profile]
cycle_unit                  = 2

[tltest.fuzzer]
seed                        = 1002
ari.interval                = 10000
ari.target                  = 18
stream.interval             = 100
stream.step                 = 0x40
stream.start                = 0x00000000
stream.end                  = 0x00080000

unified.enable              = 0
unified.mode                = ANVIL

unified.anvil.size          = 256
unified.anvil.epoch         = 64
unified.anvil.width.b       = 1

[tltest.logger]
verbose                     = 0
verbose.xact_fired          = 0
verbose.xact_sequenced      = 0
verbose.xact_data_complete  = 0
verbose.memory.axi_write    = 0
verbose.memory.axi_read     = 0
verbose.data_full           = 0
verbose.agent_debug         = 0
