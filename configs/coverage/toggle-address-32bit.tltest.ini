# Full-suite configuration preserved from a passing saved INI.
# 4 GiB sparse memory backing for the address-sweep trace.
[tltest.config]
core                        = 1
core.tl_c                   = 1
core.tl_ul                  = 0
core.tl_m                   = 1
maximum_cycle               = 300000
memory.enable               = 1
memory.start                = 0x00000000
memory.end = 0x100000000
memory.backend.ooor         = 0
memory.backend.rd.depth     = 0
memory.backend.rd.latency   = 0
memory.backend.wr.depth     = 0
memory.backend.wr.latency   = 0
memory.backend.cycle_unit   = 2
memory.backend.port.count   = 1
memory.sync.strict          = 0
mmio.enable                 = 0
mmio.start                  = 0
mmio.end                    = 0
cmo.enable                  = 0
cmo.start                   = 0x00000000
cmo.end                     = 0x00080000
error.hintInaccurate        = 0

[tltest.sequence]
mode.0                      = TRACE_WITH_FENCE
mode.1                      = TRACE_WITH_FENCE

[tltest.fuzzer]
trace.enable                = 1
trace.filepath = ../../traces/coverage/toggle-address-32bit.ops
