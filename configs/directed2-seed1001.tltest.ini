# Directed coverage; unchanged single-core DUT and existing trace/DPI interfaces.
[tltest.config]
core = 1
core.tl_c = 1
core.tl_ul = 0
core.tl_m = 1
maximum_cycle = 2000000
memory.enable = 1
memory.start = 0x0
memory.end = 0x8000000
memory.backend.ooor = 0
memory.backend.rd.depth = 0
memory.backend.rd.latency = 128
memory.backend.wr.depth = 0
memory.backend.wr.latency = 128
memory.backend.cycle_unit = 2
memory.backend.port.count = 1
memory.sync.strict = 0
mmio.enable = 0
cmo.enable = 0
error.hintInaccurate = 0
[tltest.plugin]
chiseldb.enable = 0
clog.enable = 0
[tltest.sequence]
mode.0 = TRACE_WITH_FENCE
mode.1 = TRACE_WITH_FENCE
[tltest.profile]
cycle_unit = 2
[tltest.fuzzer]
seed = 1001
trace.enable = 1
trace.filepath = ../../traces/directed2-clean-snoop-extra.ops
unified.enable = 0
[tltest.logger]
verbose = 0
verbose.xact_fired = 0
verbose.xact_sequenced = 0
verbose.xact_data_complete = 0
verbose.memory.axi_write = 0
verbose.memory.axi_read = 0
verbose.data_full = 0
verbose.agent_debug = 0
